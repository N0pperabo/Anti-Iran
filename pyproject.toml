[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-browser-automation-studio"
version = "1.0.0"
description = "Professional Desktop Studio for Browser Automation executed on GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Developer" }
]
dependencies = [
    "PySide6>=6.7.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
browser-studio = "app.__main__:main"
automation-runner = "automation.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
